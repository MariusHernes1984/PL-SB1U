[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pl-sb1u"
version = "0.1.0"
description = "Multi-agent solution for product lead at SpareBank 1 Utvikling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
pl-sb1u = "pl_sb1u.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pl_sb1u"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]
